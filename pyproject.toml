[project]
name = "autonomous-ai-crypto-trader"
version = "0.1.0"
description = "Autonomous AI crypto trading platform with multi-agent intelligence and risk controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "hmmlearn>=0.3.2",
  "httpx>=0.27.0",
  "python-telegram-bot>=21.3",
  "sqlalchemy>=2.0.31",
  "aiosqlite>=0.20.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
